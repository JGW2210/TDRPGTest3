<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astral Reaches — World Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="hurtflash"></div>
  <div id="deathfade"></div>
  <div id="ui">
    <div id="locline"></div>
    <div id="bounty"></div>
    <div id="hearts"></div>
    <div id="charm"></div>
    <div id="announce">
      <div id="announce-title"></div>
      <div id="announce-sub"></div>
    </div>
    <div id="hover"></div>
    <div id="dialogue">
      <div id="dialogue-text"></div>
      <div id="dialogue-hint">&#10022; click &#10022;</div>
    </div>
    <div id="hint"><b>drag</b> to turn &#10022; <b>scroll</b> to zoom &#10022; <b>click</b> a hex to sail &#10022; <b>M</b> or the chart opens the free camera &#10022; <b>F</b> finds your wisp &#10022; <b>R</b> births a new cosmos</div>
    <div id="seedline"></div>
    <div id="chartbtn" title="the star chart — free camera">&#10022; star chart &#10022;</div>
    <div id="tpanel">
      <div id="tpanel-title">the teleport stone hums</div>
      <div id="tpanel-sub">charted islands on this orbit</div>
      <div id="tpanel-list"></div>
      <div id="tpanel-cancel">&#10022; stay &#10022;</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
